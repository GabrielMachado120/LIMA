<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Exemplos box-level e inline-level</h1>
    <p>
      Parágrafo é box-level (quebra de linha automaticamente), mas os
      <a href="#">Links são inline-level</a> (permanecem na mesma linha).
    </p>

    <h2>box-sizing:</h2>
    <div class="content-box">Content-box (padrão)</div>
    <div class="border-box">Border-box</div>
</body>
</html>
