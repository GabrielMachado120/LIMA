<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula3</title>
</head>
<body>
    <!--Cabeçalho-->
    <header> 
        <h1>Cores, Imagens e Links</h1>
    </header>
    <main>
        <!--Cores em HTML-->
            <section style="text-align: center;">
                <h2>Formatos de Cor no CSS</h2>
                <h3 style="color: #FF5733;">Título com cor Hexadecimal</h3>
                <h3 style="color: rgb(0, 128, 255);">Título com cor em RGB</h3>
                <h3 style="color: rgba(0, 128, 0, 0.6);">Título com cor em RGBA</h3>
            </section>
            <hr>
            <section style="text-align: center;">
                <p style="color: blue;">Texto em uma cor específica!</p>
                <p style="background-color: black; color: rgb(252, 3, 252);">Fundo do texto em uma cor específica!</p>
            </section>
            <hr>
            <!--Imagem como elemento da página-->
            <section>
                <img src="assets/fundo.jpg" alt="Teste" title="Teste">
            </section>
            <hr>
            <!--Imagem como Background-->
            <section>
                <div style="
                    border: 1px solid red;
                    width: 500px;
                    height: 500px;
                    color: rgb(0, 68, 255);
                    text-align: center;
                    background-image: url('assets/fundo.jpg');
                    background-size: 200px 200px;
                    background-repeat: no-repeat;
                    background-position: center;
                     " >
                    <h2>Imagem como background</h2>
                    <p>Esta seção tem uma imagem de fundo.</p>
                </div>
            </section>
            <hr>
            <!--Vídeos-->
            <section>
                <h1>Vídeos em HTML</h1>
                <video src="" controls autoplay loop width="560" height="315">
                    Seu navegador não suporta o elemento de vídeo.
                </video>
            </section>
            <hr>
            <section>
                <h1>Vídeos Externos</h1>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/uZn67dD03ac?si=25ru7ZR-PhrowW0w" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                <iframe src="https://www.google.com/maps/embed?pb=!4v1790003559555!6m8!1m7!1sBtUKF_6g6ntS8Gkj17Edbw!2m2!1d-21.44982482662064!2d-47.00816213373864!3f69.44687391955011!4f-21.0699137078916!5f0.7820865974627469" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>
    </main>
</body>
</html>
