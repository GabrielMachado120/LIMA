<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 4 - Formulário</title>
  </head>
  <body>
    <header style="text-align: center;">
      <h1>Formulários</h1>
    </header>
    <hr>
    <main>
      <section>
        <h2>Formulário</h2>
        <form action="cadastro.php" method="post">
          <p>
            <label>Nome: </label>
            <input type="text" name="nome" placeholder="Digite seu Nome" required>
          </p>
          <p>
            <label>Senha: </label>
            <input type="password" name="senha" required maxlength="8" placeholder="Digite sua Senha">
          </p>
          <p>
            <label>E-mail: </label>
            <input type="email" name="email" required placeholder="Digite seu E-mail">
          </p>
          <p>
            <label>Telefone: </label>
            <input type="text" name="telefone" required placeholder="(99) 99999-9999" title="Use o Formato: (99) 99999-9999" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
          </p>
          <p>
            <label>CEP: </label>
            <input type="text" name="cep" placeholder="13733-360" title="Use esse formato: 13733-360" required pattern="[0-9]{5}-[0-9]{3}">
          </p>
          <p>
            <label>Sobre você: </label>
            <textarea name="bio" rows="10" cols="100" disabled></textarea>
          </p>
          <p>
            <label>Gênero: </label>
            <input type="radio" name="genero" value="M">Masculino
            <input type="radio" name="genero" value="F">Feminino
          </p>
          <p>
            <label>Interesses: </label>
            <input type="checkbox" name="interesses" value="tecnologia">Tecnologia
            <input type="checkbox" name="interesses" value="esportes">Esportes
            <input type="checkbox" name="interesses" value="artes">Artes
          </p>
          <p>
            <label>País: </label>
            <select name="pais">
                <option value="">---</option>
                <option value="brasil">Brasil</option>
                <option value="argentina">Argentina</option>
                <option value="chile">Chile</option>
            </select>
          </p>
          <p>
            <label>Foto de Perfil: </label>
            <input type="file" name="foto">
          </p>
          <input type="submit" value="Enviar">
          <input type="reset" value="Limpar">
        </form>
      </section>
    </main>
  </body>
</html>
